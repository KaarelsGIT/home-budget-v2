spring.application.name=home-budget-app-v2

server.address=0.0.0.0
server.port=8080

spring.web.resources.add-mappings=true

spring.datasource.url=jdbc:mysql://localhost:3306/home_budget_v2?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:budget_user}
spring.datasource.password=${DB_PASSWORD:budget_pass}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

spring.thymeleaf.cache=false

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

jwt.secret=abcdefghijklmnopqrstuvwxyz123456
